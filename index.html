<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Generator - Mukai</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Toast notification - shows "Item added" -->
<div id="toast"></div>

<div class="wrap">

  <!-- LEFT: FORM -->
  <div class="card no-print">
    <h2>Create Invoice</h2>

    <!-- BUSINESS -->
    <h3>Your Business</h3>
    <label>Business Name</label>
    <input id="business" value="Persons Shops">

    <label>Business Email</label>
    <input id="businessEmail" value="person@email.com">

    <label>Business Phone</label>
    <input id="businessPhone" value="0700 000 000">

    <label>Business Address</label>
    <input id="businessAddress" placeholder="e.g. Nairobi, Kenya">

    <!-- CLIENT -->
    <h3>Client</h3>
    <label>Client Name</label>
    <input id="client" placeholder="e.g.Persons Shop">

    <label>Client Email</label>
    <input id="clientEmail" placeholder="client@email.com">

    <!-- INVOICE DETAILS -->
    <h3>Invoice Details</h3>
    <label>Invoice No.</label>
    <input id="inNo" value="INV-001">

    <label>Date</label>
    <input type="date" id="date">

    <label>Due Date</label>
    <input type="date" id="dueDate">

    <!-- ITEM -->
    <h3>Add Item</h3>
    <label>Description</label>
    <input id="description" placeholder="e.g. Logo Design">

    <label>Quantity</label>
    <input type="number" id="quantity" value="1">

    <label>Price (KES)</label>
    <input type="number" id="price" placeholder="2000">

    <!-- script.js looks for addItemBtn -->
    <button id="addItemBtn" type="button">+ Add Item</button>

    <!-- VAT + DISCOUNT -->
    <h3>Totals</h3>
    <label>VAT Rate (%)</label>
    <input type="number" id="vatRate" value="16">

    <label>Discount (KES)</label>
    <input type="number" id="discount" value="0">

    <!-- PAYMENT -->
    <h3>Payment</h3>
    <label>M-PESA Till / Number</label>
    <input id="mpesa" value="123456">

    <label>Bank Name</label>
    <input id="bankName" placeholder="e.g. Equity Bank">

    <label>Bank Account</label>
    <input id="bankAccount" placeholder="e.g. 1234567890">

    <label>Notes</label>
    <input id="notes" placeholder="Thank you for your business!">

    <button class="green" onclick="window.print()">Print / Save as PDF</button>
  </div>

  <!-- RIGHT: PREVIEW  -->
  <div class="card" id="invoicePreview">
    <h2>Invoice Preview</h2>
    <div id="invoiceContent">

      <!-- Business header - filled by JS -->
      <div class="invoice-header">
        <h3 id="businessName"></h3>
        <p id="businessContactInfo"></p>
        <p id="businessPhonePreview"></p>
        <p id="businessAddressPreview"></p>
      </div>

      <!-- Client + Invoice details -->
      <div class="invoice-details">
        <p><strong>Client:</strong> <span id="clientName"></span></p>
        <p><strong>Client Email:</strong> <span id="clientEmailPreview"></span></p>
        <p><strong>Invoice No:</strong> <span id="invoiceNo"></span></p>
        <p><strong>Date:</strong> <span id="invoiceDate"></span></p>
        <p><strong>Due Date:</strong> <span id="dueDatePreview"></span></p>
      </div>

      <!-- Items table - JS fills itemsBody -->
      <table id="itemsTable">
        <thead>
          <tr>
            <th>Description</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="itemsBody">
          <!-- JS adds rows here -->
        </tbody>
      </table>

      <!-- Totals-IDs must match script.js -->
      <div class="total-amount">
        <p>Subtotal: <b id="subtotal">KES 0</b></p>
        <p>Discount: <b id="discountPreview">- KES 0</b></p>
        <p>VAT (<span id="vatLabel">16</span>%): <b id="tax">KES 0</b></p>
        <p>Total: <b id="totalAmount">KES 0</b></p>
      </div>

      <!-- Payment + Notes -->
      <div class="payment-info">
        <p><strong>M-PESA:</strong> <span id="mpesaPreview"></span></p>
        <p><strong>Bank:</strong> <span id="bankPreview"></span></p>
        <p id="notesPreview" style="color:#666;font-size:13px"></p>
      </div>

    </div>
  </div>
</div>

<script src="invoice.js"></script>
</body>
</html>
